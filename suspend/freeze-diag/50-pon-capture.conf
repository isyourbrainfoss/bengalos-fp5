# FP5 suspend-freeze diagnosis (2026-11-19): read-only PON/sleep-stat capture around each suspend.
# Remove with /var/lib/fp5-backup/20261119-cpuidle-test/rollback.sh
[Service]
ExecStartPost=-/var/lib/fp5-suspend-guard/fp5-pon-capture pre
ExecStopPost=-/var/lib/fp5-suspend-guard/fp5-pon-capture post
