# SUPERSEDED for the internal UFS image. Use image/profiles/device-sc7280-fp5
# (Include of upstream device-sc7280, SectorSize=4096, 81voltd and hexagon
# left enabled). This draft targeted a microSD (SectorSize=512) and its
# preset disables 81voltd, which is wrong for the lab phone.
#
# Fairphone 5 (fairphone,fp5), booted via U-Boot Tauchgang from microSD.
# DRAFT for local testing (BengalOS FP5 prep, 2026-10-27). Based on agx/otter device-sc7280.
[Build]
Environment=
        BOS_DEVICE=sc7280

[Include]
Include=../device-qcom

[Content]
Packages=
        bengalos-kernel-sc7280

Devicetrees=
        qcom/qcm6490-fairphone-fp5.dtb

KernelCommandLine=
        # Camera buffers (same as Nura FP5)
        cma=128M

[Output]
# Target is a microSD card: 512-byte logical sectors.
SectorSize=512
