# Upstream device-sc7280 from bengalos-recipes !118 (SHIFT8 / otter).
# Commit 71511f021d840250213843e39bba36548eb14244, not merged to main
# as of 2026-11-24 (main was 7e689106366e5ee38bcea47ac970883ba53ce50a).
# Kept verbatim so the FP5 profile can Include it instead of forking it.
[Build]
Environment=
        BOS_DEVICE=sc7280

[Include]
# Use the device-qcom profile as base
Include=../device-qcom

[Content]
Packages=
        bengalos-kernel-sc7280

Devicetrees=
        qcom/qcm6490-shift-otter.dtb

[Output]
# Usually UFS with 4k blocks is used.
SectorSize=4096
