# Fairphone 5 overlay on upstream device-sc7280 (UFS, 4K sectors).
# Does not replace device-sc7280. Include pulls in the otter DTB and
# SectorSize=4096. This file swaps the kernel for the desk FP5 build
# (linux-image-7.2.8-sc7280-fp5+) and adds the FP5 userspace delta.
#
# The old image/device-fp5 profile (microSD, SectorSize=512, 81voltd and
# hexagon disabled) is not used for this image. The lab phone boots from
# internal UFS and must keep VoLTE and the sensor stack on.
[Build]
Environment=
        BOS_DEVICE=sc7280

[Include]
Include=../device-sc7280

[Content]
# device-sc7280 depends on the stock metapackage. This image uses the
# desk kernel instead. Both debs come from --package-directory (see
# kernel/build-fp5-kernel.sh). Do not install the published 7.2.8-sc7280+.
Packages=
        bengalos-kernel-sc7280-fp5

RemovePackages=
        bengalos-kernel-sc7280
        linux-image-7.2.8-sc7280+

# Appended after device-sc7280's otter DTB. The UKI keeps both.
# The desk kernel package ships qcom/qcm6490-fairphone-fp5.dtb.
Devicetrees=
        qcom/qcm6490-fairphone-fp5.dtb

KernelCommandLine=
        # Camera buffers. Same value as the lab FP5 kernel command line.
        cma=128M

[Output]
# Internal UFS logical sectors are 4096 bytes. Not the old SD value of 512.
SectorSize=4096
