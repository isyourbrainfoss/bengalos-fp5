[Service]
# User obexd (session bus). It registers the cover-art L2CAP PSM with
# bluetoothd and serves BIP GetLinkedThumbnail. The prepare helper
# turns mpris:artUrl into a 200x200 JPEG under the user's cache.
ExecStart=
ExecStart=/var/lib/fp5-oot/coverart/obexd
Environment=FP5_COVERART_PREPARE=/var/lib/fp5-oot/coverart/fp5-coverart-prepare
