# FP5: let the car (HFP Hands-Free) control VoLTE calls through
# fp5-hfp-modem-bridge. Installed to ~fp5/.config/wireplumber/wireplumber.conf.d/
# Needs the patched libspa-bluez5 (bluez5/0001-*.patch). With a stock
# libspa-bluez5 the -service key is ignored and no real modem has Device
# "fp5-imsd", so nothing links: behaviour is exactly as without this file.
# The HFP/HSP backend stays "native" (we do NOT switch to ofono).
# Rollback: delete this file, then `systemctl --user restart wireplumber`.
monitor.bluez.properties = {
  bluez5.hfphsp-backend-native-modem = "fp5-imsd"
  bluez5.hfphsp-backend-native-modem-service = "io.github.isyourbrainfoss.Fp5HfpModem"
}
