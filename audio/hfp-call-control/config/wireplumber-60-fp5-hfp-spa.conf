# ~fp5/.config/systemd/user/wireplumber.service.d/60-fp5-hfp-spa.conf
# Load the patched libspa-bluez5 into WirePlumber only, and only while the
# stock one is the exact build it was made for (sha256 check in
# fp5-hfp-spa-guard). After a BengalOS update that changes PipeWire the env
# file is not written and WirePlumber runs fully stock.
# Rollback: delete this file + `systemctl --user daemon-reload` + restart wireplumber.
[Service]
ExecStartPre=-/var/lib/fp5-oot/bin/fp5-hfp-spa-guard
EnvironmentFile=-%t/fp5-hfp-spa.env
