<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- fp5-hfp-modem-bridge (user fp5) owns this name on the system bus; only
     fp5's WirePlumber (and root) may call it. The daemon re-checks the
     caller uid. Installed to /etc/dbus-1/system.d/ (read by dbus-broker on
     its next config reload; no restart needed).
     Rollback: delete this file. -->
<busconfig>
  <policy user="fp5">
    <allow own="io.github.isyourbrainfoss.Fp5HfpModem"/>
    <allow send_destination="io.github.isyourbrainfoss.Fp5HfpModem"/>
  </policy>
  <policy user="root">
    <allow send_destination="io.github.isyourbrainfoss.Fp5HfpModem"/>
  </policy>
  <policy context="default">
    <deny own="io.github.isyourbrainfoss.Fp5HfpModem"/>
    <deny send_destination="io.github.isyourbrainfoss.Fp5HfpModem"/>
  </policy>
</busconfig>
