<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- fp5-hfp-modem-bridge owns this name on the system bus; only the lab
     fp5 user (and root) may call it. The daemon re-checks the caller uid.

     Use the numeric uid 60434, not the name "fp5". dbus-daemon loads this
     file at boot, before systemd-homed has published the user, and logs
     "Unknown username fp5 in message bus configuration file". The
     allow-own policy is then ignored, the bridge cannot own the name,
     exits, and stays dead (seen on every reboot since 2026-11-20 21:31).
     A numeric uid does not need NSS. 60434 is the lab fp5 systemd-homed
     UID.

     Installed to /etc/dbus-1/system.d/ (read by dbus-daemon / dbus-broker
     on its next config reload; no daemon restart needed).
     Rollback: delete this file. -->
<busconfig>
  <policy user="60434">
    <allow own="io.github.isyourbrainfoss.Fp5HfpModem"/>
    <allow send_destination="io.github.isyourbrainfoss.Fp5HfpModem"/>
  </policy>
  <policy user="root">
    <allow send_destination="io.github.isyourbrainfoss.Fp5HfpModem"/>
  </policy>
  <policy context="default">
    <deny own="io.github.isyourbrainfoss.Fp5HfpModem"/>
    <deny send_destination="io.github.isyourbrainfoss.Fp5HfpModem"/>
  </policy>
</busconfig>
