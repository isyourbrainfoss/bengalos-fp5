# VoiceCall use case configuration for Fairphone 5
# Base: sc7280-mainline/alsa-ucm-conf 3dbb936 (Luca Weiss <luca.weiss@fairphone.com>)
# BengalOS fp5-next changes:
#  - Speaker device for speakerphone (from the human-tested pmOS FP5
#    route by lolren/Catacomb, 2026-08), ConflictingDevice with Earpiece
#  - Earpiece DisableSequence restores BOTH amps (the base leaves R muted
#    and L in Receiver if the exec fails halfway, which is the state the
#    phone is in on 2026-11-02)
#  - hostless VoiceMMode1 = PCM 7 is opened by dummystreamhack user units
#    *after* the routing csets (ordering matters); q6voiced must be OFF.

SectionVerb {
	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='QUIN_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='QUIN_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value.TQ "Voice"
}

SectionDevice."Earpiece" {
	Comment "Earpiece Playback"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		# Top amp (L) as receiver, bottom amp (R) muted
		cset "name='Amplifier R Playback Switch' off"
		cset "name='Amplifier L Profile Set' Receiver"

		exec "systemctl --user start dummystreamhack@Rhw:${CardId},7"
	]

	DisableSequence [
		exec "systemctl --user stop dummystreamhack@Rhw:${CardId},7"

		cset "name='Amplifier L Profile Set' Music"
		cset "name='Amplifier R Profile Set' Music"
		cset "name='Amplifier R Playback Switch' on"
	]

	Value {
		PlaybackChannels 1
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackVolume "Amplifier L PCM Playback Volume"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='Amplifier L Profile Set' Music"
		cset "name='Amplifier R Profile Set' Music"
		cset "name='Amplifier R Playback Switch' on"
		cset "name='Amplifier L Playback Switch' on"

		exec "systemctl --user start dummystreamhack@Rhw:${CardId},7"
	]

	DisableSequence [
		exec "systemctl --user stop dummystreamhack@Rhw:${CardId},7"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackVolume "Amplifier Playback Volume"
	}
}

SectionDevice."Mic1" {
	Comment "Bottom Microphone"

	# One inline sequence on purpose: when the wcd938x and tx-macro Include
	# files plus a local EnableSequence are combined, alsa-lib merges the
	# arrays by index, so only the last include survived (ADC1 stayed off and
	# the dummystreamhack/fp5-call-mic execs never ran). Same csets, in order:
	# wcd938x AnalogMic1, tx-macro SoundwireMic0, then the local execs.
	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 100"

		exec "systemctl --user start dummystreamhack@Thw:${CardId},7"
		exec "systemctl --user --no-block start fp5-call-mic.service"
	]

	DisableSequence [
		exec "systemctl --user --no-block stop fp5-call-mic.service"
		exec "systemctl --user stop dummystreamhack@Thw:${CardId},7"

		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='ADC1_MIXER Switch' 0"
		# 'ADC1 Switch' is NOT turned off any more (fix/first-call-mic):
		# it is only the SoundWire port enable, read at stream open; analog
		# power follows DAPM. Leaving it on means the next open always
		# gets a working mic port.
		cset "name='TX0 MODE' ADC_INVALID"
	]

	Value {
		CaptureChannels 1
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC1"
		CaptureVolume "ADC1 Volume"
	}
}
