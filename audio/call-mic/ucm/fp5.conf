# Use case configuration for Fairphone 5
# Author: Luca Weiss <luca.weiss@fairphone.com>

Syntax 4

LibraryConfig.remap.Config {
	ctl.default.map."name='Amplifier Playback Volume'" {
		"name='Amplifier L PCM Playback Volume'".vindex.0 0
		"name='Amplifier R PCM Playback Volume'".vindex.1 0
	}
	# BengalOS fix/first-call-mic (2026-11-20): volume-only alias of
	# 'ADC1 Volume' for the Mic1 devices. PipeWire (ACP) treats the switch
	# of a mixer element as hardware mute; for element "ADC1" that is
	# 'ADC1 Switch', which on wcd938x is the SoundWire port enable, applied
	# only at stream open. ACP writing it off at the first Voice Call of a
	# boot gave a dead call mic. This alias has no switch, so ACP keeps the
	# hardware mic gain but mutes in software and never touches ADC1 Switch.
	ctl.default.map."name='FP5 Mic Capture Volume'" {
		"name='ADC1 Volume'".vindex.0 0
	}
}

SectionUseCase."HiFi" {
	File "/Fairphone/fp5/HiFi.conf"
	Comment "HiFi quality Music."
}

SectionUseCase."Voice Call" {
	File "/Fairphone/fp5/VoiceCall.conf"
	Comment "Phone call quality."
}

BootSequence [
	cset "name='ADC1 Volume' 12"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
