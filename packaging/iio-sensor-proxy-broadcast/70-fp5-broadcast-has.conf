# FP5 (2026-11-17): run iio-sensor-proxy 3.9 + 0001-broadcast-has-properties.patch so phosh
# learns HasAmbientLight after fp5-ssc-rescan restarts the proxy (brightness auto/manual arrow).
# Remove this file + daemon-reload + restart iio-sensor-proxy to go back to the stock binary.
[Service]
ExecStart=
ExecStart=/var/lib/fp5-sensors/bin/iio-sensor-proxy.fp5
