  - id: fp5-coverart
    name: "AVRCP cover art to the car (OOT bluetoothd + obexd)"
    why: "The Tesla only shows album/audiobook art over AVRCP BIP. Debian bluez 5.88 has no cover-art server, so the car got no cover."
    branch: "feat/car-coverart"
    commit: "a0d929b"
    where: "/var/lib/fp5-oot/coverart/{bluetoothd,obexd (selector),obexd-<VERSION_ID>,fp5-coverart-prepare}; /etc/systemd/system/bluetooth.service.d/fp5-coverart.conf; ${HOME}/.config/systemd/user/obex.service.d/fp5-coverart.conf"
    upstreamable: later
    upstreamable_reason: "BlueZ cover-art patches 0001/0002 on bluez 5.88-1. Upstream BIP server work is not merged."
    scope: on-device
    required: true
    status_on_phone_20261126: present
    note: "Lives in /var, /etc and the home, so a usr/A-B update keeps it. The OOT daemons link against the image's glib/dbus/udev: symbol-check them against every new usr. obexd links libebook/libedataserver, whose sonames moved in 0.26.1127.1 (.so.4/.27 -> .so.5/.28), so obexd is now per image: /var/lib/fp5-oot/coverart/obexd is a selector script that execs obexd-$VERSION_ID and falls back to stock obexd (no art) if that build is missing. Known builds: obexd-0.26.1124.3 = 9c407eef3275ae93c3014ebc0c6f14b1b80c5fbca9f50756cfbfc25302c5de44. 28 Nov: user obex.service has no WantedBy (D-Bus activation only), so after a boot nothing starts obexd, the cover-art PSM is not registered, and the car gets no art. The active-or-wanted check catches that."
    checks:
      - kind: exists
        path: /var/lib/fp5-oot/coverart/bluetoothd
        executable: true
        sha256: "7d87d63745eab16af8a5302896782b58f6ed9f610be3ec7798e09149d6da495c"
      - kind: text
        path: /var/lib/fp5-oot/coverart/obexd
        executable: true
        contains:
          - "obexd-$V"
          - "/usr/libexec/bluetooth/obexd"
      - kind: exists
        path: /var/lib/fp5-oot/coverart/obexd-${VERSION_ID}
        executable: true
      - kind: bytes
        path: /var/lib/fp5-oot/coverart/obexd-${VERSION_ID}
        contains:
          - "AVRCP Cover Art server"
      - kind: exists
        path: /var/lib/fp5-oot/coverart/fp5-coverart-prepare
        executable: true
        sha256: "11268d10d1b8689f7101fc7bf91ac51352cab30c7b44a063630793090e0cc557"
      - kind: text
        path: /etc/systemd/system/bluetooth.service.d/fp5-coverart.conf
        contains:
          - "ExecStart=/var/lib/fp5-oot/coverart/bluetoothd"
        sha256: "b7b7194250577086a9b0516fb3a0dcf98ac77d0122f5a76e3f32b9a39d849569"
      - kind: text
        path: ${HOME}/.config/systemd/user/obex.service.d/fp5-coverart.conf
        contains:
          - "ExecStart=/var/lib/fp5-oot/coverart/obexd"
          - "FP5_COVERART_PREPARE=/var/lib/fp5-oot/coverart/fp5-coverart-prepare"
        sha256: "3754bac64cbf5849c633f167550de7ff7e9b1a942ff4d0ea3a853924795daafb"
