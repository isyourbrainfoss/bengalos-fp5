  - id: fp5-phoc-resume
    name: "phoc keeps the DRM output across session pause"
    why: "wlroots 0.20 destroys outputs when logind pauses DRM, so Phosh dies on resume and clients go blurry."
    branch: "fix/phoc-resume-output"
    commit: "7ed7b58"
    where: "fp5-phoc sysext usr/bin/phoc"
    upstreamable: yes
    upstreamable_reason: "phoc/wlroots should reuse the output on seat resume. Not part of the sdm845 fp5-feed build."
    scope: sysext
    profiles:
      - daily
    required: true
    status_on_phone_20261126: present
    sysext: fp5-phoc
    checks:
      - kind: extension-release
      - kind: bytes
        path: usr/bin/phoc
        contains:
          - "Keeping output across session pause"
          - "Re-modesetting existing output after session resume"

  - id: fp5-phosh-invalid-scale
    name: "Phosh ignores invalid output scale"
    why: "After resume Phosh can send set_scale(0) and wlroots disconnects the client."
    branch: "fix/phosh-resume-output-guard"
    commit: "8895dc6"
    where: "fp5-phosh sysext usr/libexec/phosh (not usr/bin/phosh)"
    upstreamable: yes
    upstreamable_reason: "Skipping a non-positive scale is a Phosh bugfix. Not part of the sdm845 fp5-feed build."
    scope: sysext
    profiles:
      - daily
    required: true
    status_on_phone_20261126: present
    sysext: fp5-phosh
    checks:
      - kind: extension-release
      - kind: bytes
        path: usr/libexec/phosh
        contains:
          - "Ignoring invalid scale"

  - id: fp5-gnome-calls-prefer-ims
    name: "GNOME Calls prefers the imsd origin"
    why: "Calls otherwise dials the first origin, which is ModemManager, so outgoing calls leave VoLTE."
    branch: "fix/calls-prefer-ims-origin"
    commit: "974d78e"
    where: "fp5-gnome-calls sysext usr/bin/gnome-calls or the ofono plugin libofono.so"
    upstreamable: later
    upstreamable_reason: "The preference is for this phone's imsd origin. Do not search for the string calls-default-origin; it is not in the binary."
    scope: sysext
    profiles:
      - daily
    required: true
    status_on_phone_20261126: present
    sysext: fp5-gnome-calls
    checks:
      - kind: extension-release
      - kind: bytes-one-of
        paths:
          - usr/bin/gnome-calls
          - usr/lib/aarch64-linux-gnu/calls/plugins/provider/ofono/libofono.so
        contains:
          - "calls_pick_tel_default_origin"
        warn_contains:
          - "calls_origin_name_is_imsd"

  - id: fp5-volte-modules
    name: "Out-of-tree modules for the volte kernel"
    why: "The 1109 module tree matches vermagic 7.2.8-sc7280-volte20261107+ only. The 1124.3 kernel 7.2.8-sc7280-fp5+ must not fail because this sysext is absent."
    branch: "feed/carry-local-sysexts"
    commit: "99920de"
    where: "fp5-volte-modules sysext usr/lib/modules/<uname>/"
    upstreamable: no
    upstreamable_reason: "Tied to one local kernel build. A different uname needs its own modules."
    scope: version-conditional
    profiles:
      - feed
      - daily
    required: true
    status_on_phone_20261126: not-applicable
    sysext: fp5-volte-modules
    when_kernel_uname:
      - "7.2.8-sc7280-volte20261107+"
    checks:
      - kind: extension-release
      - kind: kernel-modules

