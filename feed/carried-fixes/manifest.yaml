    branch: "user-home, not in git"
    commit: ""
    where: "/opt/fp5-imsd/service/ownership.py on the writable root"
    upstreamable: no
    upstreamable_reason: "Local guard around a local kernel package name."
    scope: on-device
    required: true
    status_on_phone_20261126: present
