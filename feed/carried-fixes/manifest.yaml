# Local FP5 customisations that must be carried. Human list: docs/CARRIED-FIXES.md.
# Narrative changelog stays in docs/AVVIK.md. Do not put secrets in this file.
schema: 1

items:
  - id: mm-keep-ims-bearer
    name: "ModemManager spares the IMS bearer"
    why: "NetworkManager Simple.Disconnect(\"/\") on suspend must not tear down the IMS bearer, or incoming VoLTE during sleep falls back to CS."
    branch: "fix/mm-keep-ims-bearer"
    commit: "d99036b"
    where: "fp5-modemmanager sysext usr/sbin/ModemManager (live /usr/sbin/ModemManager)"
    upstreamable: later
    upstreamable_reason: "The spare is local policy on Debian 1.25.95-1. Rebase it onto a newer daemon; do not drop the sysext when MM#1110 lands."
    scope: sysext
    profiles:
      - feed
      - daily
    required: true
    status_on_phone_20261126: missing
    sysext: fp5-modemmanager
    note: "Feed carry binary as of 99920de starts fc7239de (1.25.95-1 + 9317cbc4 + keep-IMS). The 15 Nov daemon e43649ed (build-id 92e75ebc) is MM#1110 only and is the broken-for-suspend binary. Do not pin e43649ed. The gate is the spare string, not the hash."
    checks:
      - kind: bytes
        path: usr/sbin/ModemManager
        contains:
          - "sparing IMS bearer"

  - id: mm-qmapmux-1110
    name: "ModemManager includes MM#1110"
    why: "Debian modemmanager 1.25.95-1 still use-after-frees the netlink completion on qmapmux. Upstream 9317cbc4 is not in the 1124.3 package."
    branch: "fix/mm-keep-ims-bearer"
    commit: "d99036b"
    where: "fp5-modemmanager sysext usr/share/doc/fp5-modemmanager/mm-9317cbc4.patch, or the keep-IMS daemon which is built on top of that commit"
    upstreamable: later
    upstreamable_reason: "Drop this marker only once the official modemmanager package contains 9317cbc4. The IMS spare still stays."
    scope: sysext
    profiles:
      - feed
      - daily
    required: true
    status_on_phone_20261126: present
    sysext: fp5-modemmanager
    match: any
    checks:
      - kind: text
        path: usr/share/doc/fp5-modemmanager/mm-9317cbc4.patch
        contains:
          - "9317cbc4"
      - kind: bytes
        path: usr/sbin/ModemManager
        contains:
          - "sparing IMS bearer"

