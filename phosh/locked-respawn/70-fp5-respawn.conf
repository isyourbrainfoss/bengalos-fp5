# FP5 (Grok Bot 2026-11-19): respawn phosh inside the session instead of ending it,
# and start every respawn --locked. Notes: grok_build/fp5/notes/PHOSH-DEATH-20261119-2204.md
# Rollback: ~/.local/state/fp5-phosh-respawn/rollback.sh
[Service]
# Auto-restart without passing through "failed" -> OnFailure=gnome-session-shutdown.target
# is skipped until StartLimitBurst=3 / 15s (upstream values, unchanged) is hit.
RestartMode=direct
ExecStart=
ExecStart=/home/fp5/.local/bin/fp5-phosh-respawn
# GTK3 routes libwayland-client messages (protocol errors) to Gdk debug level.
Environment=G_MESSAGES_DEBUG=Gdk
