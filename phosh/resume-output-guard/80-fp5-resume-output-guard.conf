# FP5 (2026-11-21): do not burn StartLimit when phosh dies on resume
# before phoc is advertising an enabled output.
#
# Sits beside 70-fp5-respawn.conf. Does not clear ExecStart, so
# ~/.local/bin/fp5-phosh-respawn and RestartMode=direct stay. Does not
# set Environment, so ha-lights.conf (LD_PRELOAD=libfp5-phosh-plugin-scan.so)
# stays. install.sh rewrites @BINDIR@.
#
# Upstream mobi.phosh.Shell.service (phosh 0.59):
#   StartLimitIntervalSec=15s
#   StartLimitBurst=3
#   Restart=on-failure
#   RestartSec defaults to 100ms
#   OnFailure=gnome-session-shutdown.target
#   OnFailureJobMode=replace-irreversibly
# On 21 Nov, after resume, phosh exited three times in about 2s with
# outputs: 0. That hit burst 3 and OnFailure ended the session.
# RestartMode=direct (from the 70 drop-in) only skips OnFailure until
# the start limit is hit.
#
# Chosen values:
#   RestartSec=2
#     The 2s outputs:0 flap cannot stack three starts inside a couple
#     of seconds. A crash loop with the output already up still reaches
#     the limit in about 6s (deaths at 0s, 2s, 4s, 6s).
#   StartLimitBurst=4
#   StartLimitIntervalSec=120s
#     One or two deaths do not end the session. Four do.
#     ExecStartPre waits up to 20s when no output is enabled, so four
#     failed starts with a dead compositor take about
#     4 * (20s wait + 2s restart) = 88s, which is still inside 120s.
#     OnFailure then runs, same irreversible shutdown as upstream.
#     A phosh that stays up resets the window once 120s pass.
#
# The pre-start helper exits 0 on timeout, so a compositor that never
# advertises an output cannot wedge the session inside ExecStartPre.

[Unit]
StartLimitIntervalSec=120s
StartLimitBurst=4

[Service]
RestartSec=2
ExecStartPre=@BINDIR@/fp5-phosh-wait-output
