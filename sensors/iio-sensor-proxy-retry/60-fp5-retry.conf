# FP5 (2026-11-17, B54): retry iio-sensor-proxy if it fails at start.
# After the B53 reboot (boot ~22:30:17 16 Nov, NTP clock jump 22:24->22:30:58),
# fp5-ssc-rescan restarted the proxy once SSC light was up (normal, because
# the first probe often sees only the accelerometer). That start failed at
# 22:31:12 with status=226/NAMESPACE:
#   Failed to set up mount namespacing: /proc: No such file or directory
#   Failed at step NAMESPACE spawning /usr/libexec/iio-sensor-proxy
# With Restart=no the unit stayed failed, so auto-brightness, rotation and
# proximity were dead until a manual start at 08:54 on 17 Nov.
# The /proc error is a mount-namespace race at boot (the unit uses
# ProtectSystem=strict and PrivateTmp=true). It showed up around the clock
# jump; a short RestartSec lets the next start happen after /proc is there.
# Remove: rm this file && systemctl daemon-reload
# Rollback: run0 sh /var/lib/fp5-backup/20261117-iio-retry/rollback.sh --apply
[Service]
Restart=on-failure
RestartSec=3

[Unit]
StartLimitBurst=8
StartLimitIntervalSec=60
